<app-to-do-status-bar [status]="todo().status" (statusChanged)="onStatusChanged($event)" />
<div class="task-title">
    <p class="label">{{ 'BACKLOG.TASK' | translate }}:</p>
    @if(textInEditModeId()){
    <div class="item-container item-container--title" appClickOutside (appClickOutside)="textInEditModeId.set(false)">
        <mat-form-field appearance="outline" class="form-field">
            <input class="form-input" matInput type="text" [(ngModel)]="localText" />
        </mat-form-field>
        <app-templated-button class="button" appTooltip="{{ 'TOOLTIP.SAVE' | translate }}" [isDisabled]="isTextEmpty()"
            (clicked)="onTextSaved()" bgColor="var(--primary-bg-color)">
            <span class="save-icon">
                <mat-icon>save</mat-icon>
            </span>
        </app-templated-button>
    </div>
    } @else {
    <div class="item-container item-container--title">
        <button class="list-item-task" appTooltip="{{ 'TOOLTIP.DOUBLE_CLICK_TO_EDIT' | translate }}"
            (dblclick)="onSetTextEditing()">
            <span>{{ todo().text }}</span>
        </button>
    </div>
    }
</div>
<div class="task-description">
    <p class="label"> {{ 'BACKLOG.DESCRIPTION' | translate }}:</p>
    @if(descriptionInEditModeId()){
    <div class="item-container description-container" appClickOutside
        (appClickOutside)="descriptionInEditModeId.set(false)">
        <mat-form-field appearance="outline" class="form-field">
            <textarea class="form-input description-input" matInput type="text"
                [(ngModel)]="localDescription"></textarea>
        </mat-form-field>

        <app-templated-button class="button" appTooltip="{{ 'TOOLTIP.SAVE' | translate }}"
            (clicked)="onDescriptionSaved()" bgColor="var(--primary-bg-color)">
            <span class="save-icon">
                <mat-icon>save</mat-icon>
            </span>
        </app-templated-button>
    </div>
    } @else {
    <div class="item-container description-container">
        <button class="list-item-task description" appTooltip="{{ 'TOOLTIP.DOUBLE_CLICK_TO_EDIT' | translate }}"
            (dblclick)="onSetDescriptionEditing()">
            {{ todo().description }}
        </button>
    </div>
    }
</div>
