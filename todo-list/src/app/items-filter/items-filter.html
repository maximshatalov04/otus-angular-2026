<mat-form-field appearance="outline" class="form-field">
    <mat-label>Статус</mat-label>
    <mat-select [value]="state.selectedStatus()" (valueChange)="onFilterChange($event)">
        @for (status of statusOptions | keyvalue; track status.key) {
        <mat-option [value]="status.key">
            {{ status.value }}
        </mat-option>
        }
    </mat-select>
</mat-form-field>
