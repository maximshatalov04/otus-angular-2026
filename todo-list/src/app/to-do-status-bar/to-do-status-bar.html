<ul class="status-button-list">
    @for (option of statusOrder; track option) {
    <li>
        <button class="status-button" [class.active]="status() === option"
            appTooltip="{{ 'TOOLTIP.CHANGE_STATUS' | translate }}" (click)="onStatusChanged(option)">
            {{ statusOptions[option] | translate }}
        </button>
    </li>
    }
</ul>
