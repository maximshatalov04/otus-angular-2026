@let id =selectedId();

<div class="to-do-list-wrapper">
  <ul class="to-do-list">
    @for (todo of state.visibleTodos(); track todo.id) {
      <li>
        <app-to-do-list-item
          [item]="todo"
          [class.selected]="id === todo.id" />
      </li>
    }
  </ul>

  @if (id) {
    <app-to-do-item-view [id]="id"></app-to-do-item-view>
  }
  @if (state.loading()) {
    <div class="overlay-spinner">
      <app-spinner class="loader" />
    </div>
  }
</div>
